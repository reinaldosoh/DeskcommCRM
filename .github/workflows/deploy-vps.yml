name: Deploy na VPS

# Fluxo: push na main -> "Publicar imagem Docker (GHCR)" constroi e publica as
# imagens do SEU fork -> este workflow entra na VPS por SSH, puxa as imagens novas
# e recria os containers app, worker e scheduler.
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   VPS_HOST     IP ou dominio da VPS
#   VPS_USER     usuario SSH (root)
#   VPS_SSH_KEY  chave privada SSH exclusiva para deploy
#
# O .env da VPS (segredos do Supabase etc.) nunca passa pelo GitHub.

on:
  workflow_run:
    workflows: ["Publicar imagem Docker (GHCR)"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # So publica se o build das imagens passou (ou se foi disparo manual).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      APP_DIR: /opt/deskcommcrm
    steps:
      - name: Preparar chave SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Atualizar containers na VPS
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.traefik.yml"
          $COMPOSE pull app worker scheduler
          $COMPOSE up -d app worker scheduler
          docker logout ghcr.io
          docker image prune -f
          $COMPOSE ps app worker scheduler
          REMOTE

      - name: Conferir saude do CRM
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://agentesdeatendimento.sbs/api/v1/health; then exit 0; fi
            sleep 6
          done
          echo "::error::O CRM nao respondeu ao health check apos o deploy"
          exit 1
